[package]
name = "borhan"
version = "0.1.0"
edition = "2024"
description = "Keyword memory for AI agents over MCP, CLI and HTTP, for Persian and English text"
authors = ["Pouriya Jahanbakhsh <pouriya.jb@gmail.com>"]
# Edition 2024 and let-chains, and ordered-float (under tantivy) needs 1.90.
# Without this an older toolchain reports a wall of errors instead of saying it
# is too old.
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/pouriya/borhan"
homepage = "https://github.com/pouriya/borhan"
readme = "README.md"
keywords = ["memory", "mcp", "search", "persian", "agent"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
# Metadata / keyword store. `bundled` compiles SQLite from source: no
# libsqlite3-dev on the host, same version on every machine.
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }

tokio = { version = "1.53.1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "net",
] }

# HTTP server. default-features = false drops form/tracing extractors; json
# and query are the bodies and cursor window this API uses. matched-path is
# the route template on the HTTP access log (`/api/v1/memory/{name}/search`),
# so dashboards can group by route without exploding on memory names.
axum = { version = "0.8.9", default-features = false, features = [
    "http1",
    "tokio",
    "json",
    "query",
    "matched-path",
] }

# Configuration files. default-features = false drops the env/JSON/YAML loaders
# and parsers and the whole validate-schema tree; borhan reads exactly one TOML
# file per role and nothing else.
tanzim = { version = "0.28.0", default-features = false, features = [
    "load-file",
    "parse-toml",
] }

# Only for `#[derive(Deserialize)]`/`#[derive(Serialize)]` on the two
# configuration structs. tanzim already depends on serde, so this is not a new
# crate in the tree — only a direct dependency.
serde = { version = "1.0.195", features = ["derive"] }

# Writing `server.toml` in `init server`. tanzim only reads. This is the crate
# tanzim's TOML parser already sits on, so nothing new lands in the tree beyond
# its `serde` feature; `parse` stays off because borhan never parses with it.
toml_edit = { version = "0.22.27", default-features = false, features = [
    "serde",
    "display",
] }

# The 80 random bits of a ULID, straight from the OS entropy source. Chosen
# over `rand` because there is nothing to seed and no generator to keep: one
# call, one buffer. Already in the tree (uuid, tempfile, rand all pull it), and
# it has no default features to turn off.
getrandom = "0.4.3"

# Rendering a `created_at` (unix milliseconds) as ISO-8601 with a `Z`, which is
# the only date handling borhan does. default-features = false drops `clock`
# (borhan reads its clock through SystemTime, in ulid.rs), `oldtime` and
# `wasmbind`; `alloc` is there because `to_rfc3339_opts` returns a String.
chrono = { version = "0.4.45", default-features = false, features = ["alloc"] }

# The inverted index: term dictionary, postings, positions, fieldnorms, BM25,
# segment merging, and the query syntax a search is written in, parsed by its
# grammar and scored per word and per phrase by its weights. An FST-backed
# dictionary and a segment format that no hand-rolled SQLite posting table is going to beat. What
# is *not* delegated is the tokenizer — tantivy has no notion of ZWNJ, ک/ی
# folding or Persian morphology, and no Snowball algorithm for Persian exists to
# delegate them to — and the loop combining those scores, because best-in-clause,
# coverage across clauses and min-span proximity are not expressible in the
# stock query tree.
#
# default-features = false, then mmap and the two compressors back on. The
# `stemmer` feature stays off even though borhan does stem English: what it
# enables is `tantivy::tokenizer::Stemmer`, a `TokenFilter`, which can only run
# inside an index-side analyzer chain — and `normalize::lemma` is also called on
# query words by search.rs. Stemming in the chain only would fold the stored
# term and not the one being looked up. rust-stemmers is taken directly below
# instead, which is the same crate this feature would have pulled. `stopwords`
# ships English stop lists that would be the wrong answer for a code-switched
# room even if they were the right language.
tantivy = { version = "0.26.1", default-features = false, features = [
    "mmap",
    "lz4-compression",
    "columnar-zstd-compression",
] }

# English morphology, the second half of the normalizer. Snowball's English
# algorithm is Porter2, and it is what makes `errors` and `error` one lemma
# rather than two terms that never meet. Called directly rather than through
# tantivy's `Stemmer` filter so that the query side and the index side go
# through the same function; see the tantivy note above.
#
# Last released in 2019 and quiet since, which for this crate is the point: a
# Snowball algorithm is a frozen specification, and a stemmer that changed its
# output would invalidate every posting built by the previous version.
rust-stemmers = "1.2.0"

# Unicode NFC, the first step of the normalizer. Persian text arrives from
# editors, phones and copy-paste in both composed and decomposed forms, and
# `خطا` in two encodings is two term ids and a search that silently misses.
# The only crate here that borhan did not already depend on.
unicode-normalization = "0.1.24"

# Breaking what gets stored into paragraphs and sentences. What arrives is
# assumed to be Markdown — it is a chat transcript — and a CommonMark parser is
# what tells a fenced code block from a list from a run of prose, which is the
# difference between splitting on blank lines and splitting on meaning.
# default-features = false drops `html` (borhan renders nothing), `simd`,
# `getopts` and `serde`; the pull parser is the whole of what is used.
pulldown-cmark = { version = "0.13.4", default-features = false }

# Building the `memory get --json` array. Hand-written JSON is fine until the
# first row holding a quote or a newline, and a stored sentence is exactly the
# kind of text that holds both. Already in the tree — tracing-subscriber's
# `json` feature sits on it — so this is a direct dependency, not a new crate.
serde_json = "1.0.151"

thiserror = "2.0.20"

# Used only to flatten a `#[source]` chain into one line via `{:#}`.
anyhow = "1.0"

clap = { version = "4.6.6", default-features = false, features = [
    "std",
    "derive",
    "env",
    "help",
    "usage",
    "error-context",
] }

# CLI talking to a running `serve`. Blocking on purpose: a command is one
# request then exit, and the rustls/native-tls stacks stay off because the
# probe and the fallback are `http://` on loopback.
ureq = { version = "2.12.1", default-features = false, features = ["json"] }

tracing = { version = "0.1.44", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "std",
    "fmt",
    "json",
] }


[dev-dependencies]
# A directory per test for `--home`, removed when the test ends. Already in the
# tree under tantivy.
tempfile = "3.27.0"

[profile.release]
opt-level = 'z'     # Optimize for size.
lto = true          # Enable Link Time Optimization
codegen-units = 1   # Reduce number of codegen units to increase optimizations.
panic = 'abort'     # Abort on panic
strip = true